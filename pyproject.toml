[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.1.0"
description = "Multimodal Iterative Red Teaming for Adversarial Generative-AI Evaluation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "ollama>=0.4",
    "google-genai>=0.3",
    "mflux>=0.6",
    "psutil>=5.9",
    "mlx-vlm>=0.1",
    "Pillow>=10.0",
    "hdbscan>=0.8",
    "sentence-transformers>=2.5",
    "jinja2>=3.0",
    "datasets>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
fairface = [
    # Required to run the post-hoc demographic skew pipeline (`ouroboros report`).
    # Pesi separati: scaricare res34_fair_align_multi_7_20190809.pt da
    # https://github.com/joojs/fairface in ~/.cache/ouroboros/fairface/
    "torch>=2.1",
    "torchvision>=0.16",
    "facenet-pytorch>=2.5",
]
web = [
    # Required to run `ouroboros dashboard` (M5 — Streamlit live monitor).
    # Streamlit 1.37+ ships altair>=5 and st.fragment/st.navigation.
    "streamlit>=1.37",
]
diffusers = [
    # Required for the NVIDIA/CUDA target backend (RunPod, Lambda, Colab).
    # Use: ouroboros run --target-backend diffusers
    # FLUX.2-klein needs Flux2KleinPipeline (diffusers>=0.39) and its Qwen3
    # text encoder needs transformers>=4.51. If a release lacks the class,
    # install from git: pip install "git+https://github.com/huggingface/diffusers.git"
    "diffusers>=0.39",
    "transformers>=4.51",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",  # 4/8-bit transformer quantization (CUDA only)
    "torch>=2.1",
    "torchvision>=0.16",
    "Pillow>=10.0",
]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[tool.setuptools]
packages = ["ouroboros", "ouroboros.web", "ouroboros.web.pages", "ouroboros.targets", "ouroboros.metrics"]

[tool.setuptools.package-dir]
ouroboros = "src"
"ouroboros.web" = "src/web"
"ouroboros.web.pages" = "src/web/pages"
"ouroboros.targets" = "src/targets"
"ouroboros.metrics" = "src/metrics"

[tool.pytest.ini_options]
asyncio_mode = "auto"
