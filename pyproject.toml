[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirtage"
version = "0.1.0"
description = "Multimodal Iterative Red Teaming for Adversarial Generative-AI Evaluation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "ollama>=0.4",
    "google-genai>=0.3",
    "mflux>=0.6",
    "psutil>=5.9",
    "mlx-vlm>=0.1",        # kept for MLXJudge fallback (offline use)
    "Pillow>=10.0",
    "hdbscan>=0.8",
    "sentence-transformers>=2.5",
    "jinja2>=3.0",
    "datasets>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
fairface = [
    # Required to run the post-hoc demographic skew pipeline (`mirtage report`).
    # Pesi separati: scaricare res34_fair_align_multi_7_20190809.pt da
    # https://github.com/joojs/fairface in ~/.cache/mirtage/fairface/
    "torch>=2.1",
    "torchvision>=0.16",
    "facenet-pytorch>=2.5",
]

[project.scripts]
mirtage = "mirtage.cli:main"

[tool.setuptools]
packages = ["mirtage"]

[tool.setuptools.package-dir]
mirtage = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
