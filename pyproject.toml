[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.1.0"
description = "Multimodal Iterative Red Teaming for Adversarial Generative-AI Evaluation"
requires-python = ">=3.10"
dependencies = [
    # Cross-platform core: the loop, the metrics and the report must install and
    # run anywhere. Anything platform-specific or optional lives in an extra.
    "pandas>=2.0",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "ollama>=0.4",
    "psutil>=5.9",
    "Pillow>=10.0",
    "jinja2>=3.0",
    # Strategy clustering (src/cluster.py), invoked by `ouroboros report`.
    # Heavy: sentence-transformers pulls torch.
    "hdbscan>=0.8",
    "sentence-transformers>=2.5",
    # Apple Silicon only. MLX has no wheels for other platforms, so these must
    # carry a marker: without it `pip install ouroboros` fails outright on the
    # Linux/CUDA boxes the diffusers backend exists for. On Apple Silicon they
    # are the default target (mflux) and default judge (mlx-vlm), so they are
    # installed automatically rather than hidden behind an extra.
    "mflux>=0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
seeds = [
    # Only needed to regenerate data/stable_bias_prompts.jsonl from the
    # HuggingFace source (see docs/05-dataset.md). The checked-in JSONL is what
    # a run actually reads, so this is not required to use the framework.
    "datasets>=2.14",
]
fairface = [
    # Required to run the post-hoc demographic skew pipeline (`ouroboros report`).
    # Pesi separati: scaricare res34_fair_align_multi_7_20190809.pt da
    # https://github.com/joojs/fairface in ~/.cache/ouroboros/fairface/
    "torch>=2.1",
    "torchvision>=0.16",
    "facenet-pytorch>=2.5",
]
web = [
    # Required to run `ouroboros dashboard` (M5 — Streamlit live monitor).
    # Streamlit 1.37+ ships altair>=5 and st.fragment/st.navigation.
    "streamlit>=1.37",
]
diffusers = [
    # Required for both NVIDIA/CUDA target backends (RunPod, Lambda, Colab).
    # Use: ouroboros run --target-backend diffusers    (FLUX.2-klein-4B)
    #      ouroboros run --target-backend qwen-image   (Qwen-Image-2.1)
    # Qwen's 2.1 model card requires diffusers from source and transformers>=5.17.
    # Pin a verified revision containing QwenImage21Pipeline, Flux2KleinPipeline
    # and PipelineQuantizationConfig instead of depending on a moving main.
    # Transformers 5.17 raises the effective minima beyond the model card:
    # torch>=2.5, accelerate>=1.1 and bitsandbytes>=0.46.1.
    "diffusers @ git+https://github.com/huggingface/diffusers.git@578c9b2c6636ab2424a0e56186268b83623656b2",
    "transformers>=5.17",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.46.1",  # 4/8-bit transformer + text-encoder quantization (CUDA only)
    "torch>=2.5",
    "torchvision>=0.16",
    "Pillow>=10.0",
]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[tool.setuptools]
packages = ["ouroboros", "ouroboros.web", "ouroboros.web.pages", "ouroboros.targets", "ouroboros.metrics"]

[tool.setuptools.package-dir]
ouroboros = "src"
"ouroboros.web" = "src/web"
"ouroboros.web.pages" = "src/web/pages"
"ouroboros.targets" = "src/targets"
"ouroboros.metrics" = "src/metrics"

[tool.pytest.ini_options]
asyncio_mode = "auto"
